# GCAT-BCAT-Engine/core-lite-prod operational bootstrap
#
# INSTALL PATH:
# .github/workflows/build-core-lite-prod.yml
#
# This is intentionally one workflow file. It generates the full operational
# substrate, tests it in GitHub Ubuntu, uploads artifacts, then optionally
# commits generated files back to core-lite-prod.

name: Build core-lite-prod

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit generated operational substrate after tests pass"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core-lite-prod
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate operational core-lite-prod files
        shell: python
        run: |
          import base64
          from pathlib import Path

          files = '{\n  ".github/workflows/test.yml": "",\n  "ARCHITECTURE.md": "",\n  "BUILD_VERIFICATION.json": "ewogICJleHBlY3RlZF9jaGVja3MiOiBbCiAgICAicHl0ZXN0IC1xIiwKICAgICJjb3JlLWxpdGUtcHJvZCBzZWxmdGVzdCAtLW91dCBvdXQiLAogICAgImNvcmUtbGl0ZS1wcm9kIHJ1biBleGFtcGxlcy9hbGxvdy5qc29uIC0tb3V0IG91dF9hbGxvdyIsCiAgICAiY29yZS1saXRlLXByb2QgcnVuIGV4YW1wbGVzL3NhbmRib3guanNvbiAtLW91dCBvdXRfc2FuZGJveCIKICBdCn0=",\n  "PRODUCT.md": "IyBjb3JlLWxpdGUtcHJvZCB2MDAxCgpUaGlzIHJlcG8gdmFsaWRhdGVzIHRoZSBvcGVyYXRpb25hbCBjb3JlIHN1cmZhY2UgYmVmb3JlIHRoZSBwdWJsaWMgYEdDQVQtQkNBVC1FbmdpbmUvY29yZS1saXRlYCByZXBvIGlzIHVwZGF0ZWQuCg==",\n  "README.md": "",\n  "SECURITY.md": "IyBTZWN1cml0eQoKQ29yZS1saXRlLXByb2QgdjAwMSBkb2VzIG5vdCByZXF1aXJlIGxpdmUgc2VjcmV0cy4KCkl0IHJlamVjdHMgcmF3IHNlY3JldC1saWtlIGZpZWxkcyBpbiBpbnB1dHM6CgpgYGB0ZXh0CnNlY3JldAphcGlfa2V5CnBhc3N3b3JkCnByaXZhdGVfa2V5CmBgYAo=",\n  "examples/allow.json": "",\n  "examples/deny.json": "",\n  "examples/fail_closed.json": "ewogICJzb3VyY2UiOiAiZXhhbXBsZS5mYWlsX2Nsb3NlZCIsCiAgInBheWxvYWQiOiB7CiAgICAicmlzayI6IDAuMQogIH0sCiAgIm1ldGFkYXRhIjogewogICAgImF1dGhvcml0eV9yZWYiOiAiYXV0aDpvcmc6bG9jYWwiLAogICAgInBvbGljeV9yZWYiOiAicG9saWN5OmNvcmUtbGl0ZS1wcm9kLXYwMDEiCiAgfSwKICAiZXhwZWN0ZWRfZGVjaXNpb24iOiAiRkFJTF9DTE9TRUQiCn0=",\n  "examples/sandbox.json": "",\n  "manifest.json": "",\n  "pyproject.toml": "",\n  "src/core_lite_prod/__init__.py": "X192ZXJzaW9uX18gPSAnMC4xLjAnCg==",\n  "src/core_lite_prod/cli.py": "ZnJvbSAuY29yZSBpbXBvcnQgbWFpbgoKaWYgX19uYW1lX18gPT0gIl9fbWFpbl9fIjoKICAgIG1haW4oKQo=",\n  "src/core_lite_prod/core.py": "",\n  "tests/test_core_lite_prod.py": ""\n}'

          for path, encoded in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

      - name: Install generated package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run operational selftest
        run: core-lite-prod selftest --out out

      - name: Run allow smoke
        run: core-lite-prod run examples/allow.json --out out_allow

      - name: Run sandbox smoke
        run: core-lite-prod run examples/sandbox.json --out out_sandbox

      - name: Create generated file bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          zip -r dist/core-lite-prod-generated-v001.zip \
            README.md \
            ARCHITECTURE.md \
            PRODUCT.md \
            SECURITY.md \
            BUILD_VERIFICATION.json \
            manifest.json \
            pyproject.toml \
            examples \
            src \
            tests \
            .github/workflows/test.yml
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bundle = Path("dist/core-lite-prod-generated-v001.zip")
          manifest = {
              "name": "core-lite-prod-generated-v001.zip",
              "sha256": hashlib.sha256(bundle.read_bytes()).hexdigest(),
              "purpose": "Generated core-lite-prod operational substrate after tests/selftests passed.",
              "target_repo": "GCAT-BCAT-Engine/core-lite-prod",
              "contains": [
                  "README.md",
                  "ARCHITECTURE.md",
                  "PRODUCT.md",
                  "SECURITY.md",
                  "BUILD_VERIFICATION.json",
                  "manifest.json",
                  "pyproject.toml",
                  "examples/",
                  "src/",
                  "tests/",
                  ".github/workflows/test.yml"
              ]
          }
          Path("dist/core-lite-prod-generated-v001-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload generated repo bundle
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-prod-generated-v001
          path: |
            dist/core-lite-prod-generated-v001.zip
            dist/core-lite-prod-generated-v001-manifest.json

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-prod-bootstrap-artifacts
          path: |
            out/selftest_report.json
            out_allow/run_report.json
            out_allow/receipt.json
            out_allow/artifact_manifest.json
            out_sandbox/run_report.json
            out_sandbox/receipt.json
            out_sandbox/artifact_manifest.json
            dist/core-lite-prod-generated-v001.zip
            dist/core-lite-prod-generated-v001-manifest.json

      - name: Commit generated files
        if: ${{ github.event.inputs.commit_changes == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build core-lite-prod operational substrate v001" || echo "No changes to commit"
          git push
