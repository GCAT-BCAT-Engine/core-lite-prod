name: Curiosity Motive Admission

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemas/curiosity-motive-admission.schema.json"
      - "tools/check_curiosity_motive_admission.py"
      - "tools/check_curiosity_motive_admission_release.py"
      - "tools/check_curiosity_motive_admission_release_v3.py"
      - "examples/curiosity-motive-admission.example.json"
      - "tests/test_curiosity_motive_admission.py"
      - "tests/test_custody_record_envelope.py"
      - "receipts/curiosity-motive-admission-validation.json"
      - "outbound/curiosity-motive-admission-manifest.json"
      - "receipts/master-records-curiosity-motive-custody-ack.json"
      - "records/custody-chain-semantics-reopening-001.json"
      - "docs/CURIOSITY_MOTIVE_ADMISSION_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-admission.yml"
  push:
    branches: [main]
    paths:
      - "schemas/curiosity-motive-admission.schema.json"
      - "tools/check_curiosity_motive_admission.py"
      - "tools/check_curiosity_motive_admission_release.py"
      - "tools/check_curiosity_motive_admission_release_v3.py"
      - "examples/curiosity-motive-admission.example.json"
      - "tests/test_curiosity_motive_admission.py"
      - "tests/test_custody_record_envelope.py"
      - "receipts/curiosity-motive-admission-validation.json"
      - "outbound/curiosity-motive-admission-manifest.json"
      - "receipts/master-records-curiosity-motive-custody-ack.json"
      - "records/custody-chain-semantics-reopening-001.json"
      - "docs/CURIOSITY_MOTIVE_ADMISSION_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-admission.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate canonical admission record
        run: |
          mkdir -p reports/current
          python tools/check_curiosity_motive_admission.py | tee reports/current/curiosity-motive-admission-validation.json
      - name: Validate migrated release receipt and custody acknowledgement
        run: |
          python tools/check_curiosity_motive_admission_release_v3.py | tee reports/current/curiosity-motive-admission-release-validation.json
          python tools/check_curiosity_motive_admission_release_v3.py --require-ack | tee reports/current/curiosity-motive-admission-custody-ack-validation.json
      - name: Confirm missing acknowledgement remains blocked
        run: |
          set +e
          python tools/check_curiosity_motive_admission_release_v3.py --require-ack --ack-import reports/current/nonexistent-acknowledgement.json > reports/current/curiosity-motive-admission-missing-ack-status.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('reports/current/curiosity-motive-admission-missing-ack-status.json').read_text())
          assert result['status']=='BLOCKED'
          assert result['custody_state']=='AWAITING_DESTINATION_ACKNOWLEDGEMENT'
          PY
      - name: Validate migrated custody record envelope
        run: python -m unittest tests/test_curiosity_motive_admission.py tests/test_custody_record_envelope.py
      - name: Emit exact-head execution receipt
        run: |
          python - <<'PY' | tee reports/current/custody-record-envelope-execution.json
          import json, os
          print(json.dumps({"repository":"GCAT-BCAT-Engine/core-lite-prod","workflow":"Curiosity Motive Admission","head_sha":os.environ['GITHUB_SHA'],"execution_state":"EXECUTED","authority_effect":"NONE"}, sort_keys=True))
          PY
      - name: Upload admission and custody-envelope evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curiosity-motive-custody-envelope-${{ github.sha }}
          path: |
            reports/current/curiosity-motive-admission-validation.json
            reports/current/curiosity-motive-admission-release-validation.json
            reports/current/curiosity-motive-admission-custody-ack-validation.json
            reports/current/curiosity-motive-admission-missing-ack-status.json
            reports/current/custody-record-envelope-execution.json
            receipts/master-records-curiosity-motive-custody-ack.json
            records/custody-chain-semantics-reopening-001.json
            docs/CURIOSITY_MOTIVE_ADMISSION_MIRROR_HANDOFF.md
          if-no-files-found: error
          retention-days: 30
