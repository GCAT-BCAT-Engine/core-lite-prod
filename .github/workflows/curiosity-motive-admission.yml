name: Curiosity Motive Admission

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemas/curiosity-motive-admission.schema.json"
      - "tools/check_curiosity_motive_admission.py"
      - "examples/curiosity-motive-admission.example.json"
      - "tests/test_curiosity_motive_admission.py"
      - "receipts/curiosity-motive-admission-validation.json"
      - "outbound/curiosity-motive-admission-manifest.json"
      - "receipts/master-records-curiosity-motive-custody-ack.json"
      - "tools/check_curiosity_motive_admission_release.py"
      - "tests/test_curiosity_motive_admission_release.py"
      - ".github/workflows/curiosity-motive-admission.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/curiosity-motive-admission.schema.json"
      - "tools/check_curiosity_motive_admission.py"
      - "examples/curiosity-motive-admission.example.json"
      - "tests/test_curiosity_motive_admission.py"
      - "receipts/curiosity-motive-admission-validation.json"
      - "outbound/curiosity-motive-admission-manifest.json"
      - "receipts/master-records-curiosity-motive-custody-ack.json"
      - "tools/check_curiosity_motive_admission_release.py"
      - "tests/test_curiosity_motive_admission_release.py"
      - ".github/workflows/curiosity-motive-admission.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical admission record
        run: |
          mkdir -p reports/current
          python tools/check_curiosity_motive_admission.py | tee reports/current/curiosity-motive-admission-validation.json
      - name: Validate release receipt and custody candidate
        run: |
          python tools/check_curiosity_motive_admission_release.py | tee reports/current/curiosity-motive-admission-release-validation.json
      - name: Validate exact Master Records custody acknowledgement import
        run: |
          python tools/check_curiosity_motive_admission_release.py --require-ack | tee reports/current/curiosity-motive-admission-custody-ack-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('reports/current/curiosity-motive-admission-custody-ack-validation.json').read_text(encoding='utf-8'))
          assert result['status']=='COMPLETE'
          assert result['custody_state']=='ACKNOWLEDGED'
          assert result['normative_decision']=='DENY'
          assert result['execution_activated'] is False
          assert result['input_mutated'] is False
          assert result['next_task']=='SESSION-CONSOLIDATION-001'
          assert result['ack_import_hash']=='1d65230536d7cc7db60cc544c84d42d9d25fc3c9382b66d703476ac34b88813e'
          assert result['acknowledgement_hash']=='0a98789be976aad5c18936fe823f9732d683f4e149051e34976eb4743678eb24'
          PY
      - name: Confirm missing acknowledgement remains blocked
        run: |
          set +e
          python tools/check_curiosity_motive_admission_release.py --require-ack --ack-import reports/current/nonexistent-acknowledgement.json > reports/current/curiosity-motive-admission-missing-ack-status.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('reports/current/curiosity-motive-admission-missing-ack-status.json').read_text(encoding='utf-8'))
          assert result['status']=='BLOCKED'
          assert result['custody_state']=='AWAITING_DESTINATION_ACKNOWLEDGEMENT'
          assert result['next_task']=='MR-GCAT-CMG-CUSTODY-001'
          PY
      - name: Run focused admission and custody tests
        run: |
          python -m unittest tests/test_curiosity_motive_admission.py tests/test_curiosity_motive_admission_release.py
      - name: Run repository test suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Upload admission, custody, and acknowledgement evidence
        uses: actions/upload-artifact@v4
        with:
          name: curiosity-motive-admission-validation-${{ github.sha }}
          path: |
            reports/current/curiosity-motive-admission-validation.json
            reports/current/curiosity-motive-admission-release-validation.json
            reports/current/curiosity-motive-admission-custody-ack-validation.json
            reports/current/curiosity-motive-admission-missing-ack-status.json
            receipts/curiosity-motive-admission-validation.json
            outbound/curiosity-motive-admission-manifest.json
            receipts/master-records-curiosity-motive-custody-ack.json
          if-no-files-found: error
          retention-days: 30
