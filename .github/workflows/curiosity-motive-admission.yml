name: Curiosity Motive Admission

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "receipts/master-records-curiosity-motive-custody-ack.json"
      - "records/custody-chain-semantics-reopening-001.json"
      - "tests/test_custody_record_envelope.py"
      - "docs/CURIOSITY_MOTIVE_ADMISSION_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-admission.yml"
  push:
    branches:
      - main
    paths:
      - "receipts/master-records-curiosity-motive-custody-ack.json"
      - "records/custody-chain-semantics-reopening-001.json"
      - "tests/test_custody_record_envelope.py"
      - "docs/CURIOSITY_MOTIVE_ADMISSION_MIRROR_HANDOFF.md"
      - ".github/workflows/curiosity-motive-admission.yml"

permissions:
  contents: read

jobs:
  validate-custody-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate migrated custody record envelope
        run: python -m unittest tests/test_custody_record_envelope.py
      - name: Emit exact-head execution receipt
        run: |
          mkdir -p reports/current
          python - <<'PY' | tee reports/current/custody-record-envelope-execution.json
          import json, os
          print(json.dumps({
            "repository": "GCAT-BCAT-Engine/core-lite-prod",
            "workflow": "Curiosity Motive Admission",
            "head_sha": os.environ["GITHUB_SHA"],
            "execution_state": "EXECUTED",
            "authority_effect": "NONE"
          }, sort_keys=True))
          PY
      - name: Upload custody-envelope evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custody-record-envelope-${{ github.sha }}
          path: |
            reports/current/custody-record-envelope-execution.json
            receipts/master-records-curiosity-motive-custody-ack.json
            records/custody-chain-semantics-reopening-001.json
            docs/CURIOSITY_MOTIVE_ADMISSION_MIRROR_HANDOFF.md
          if-no-files-found: error
          retention-days: 30
